<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿克曼小车 · Web 控制台</title>
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embedded');</script>
<style>
  :root{
    --bg:#0e1116; --panel:#171b22; --panel2:#1e242d; --line:#2a313c;
    --txt:#e6e9ee; --txt2:#9aa4b2; --accent:#3b82f6; --ok:#22c55e;
    --warn:#f59e0b; --danger:#ef4444; --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:14px;}
  .wrap{max-width:1100px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;}
  .bar{display:flex;align-items:center;justify-content:space-between;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 16px;}
  .bar-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .title{font-size:16px;font-weight:600;}
  .chip{font-size:12px;padding:3px 12px;border-radius:20px;background:var(--panel2);color:var(--txt2);}
  .chip.ok{background:rgba(34,197,94,.15);color:#4ade80;}
  .chip.off{background:rgba(239,68,68,.15);color:#f87171;}
  .chip.mode{background:rgba(59,130,246,.15);color:#60a5fa;}
  .grid{display:grid;grid-template-columns:1.5fr 300px;gap:12px;align-items:start;}
  /* 工具中心有左侧导航，WebView 约 700 CSS px；保持双栏到 620px，避免整页堆成超长单列。 */
  @media(max-width:620px){.grid{grid-template-columns:1fr;}}
  /* 621~820px 是 Retroid 工具中心嵌入宽度：压缩右栏图形，首屏完整呈现雷达和摇杆。 */
  @media(min-width:621px) and (max-width:820px){
    .wrap{padding:8px;gap:8px;}
    .grid{grid-template-columns:1.45fr 250px;gap:8px;}
    .panel{padding:8px;}
    .panel h3{margin-bottom:5px;font-size:12px;}
    .side{gap:8px;}
    #radar{height:105px;}
    #joystick{width:118px;height:118px;}
    #btstat{margin:0 0 2px;font-size:10px;}
  }
  /* Android 工具页明确带 embed=1；不依赖各 ROM 不一致的 WebView CSS viewport 判定。 */
  html.embedded .wrap{padding:8px;gap:7px;}
  html.embedded body{background:#000;}
  html.embedded .grid{grid-template-columns:1.45fr 250px;gap:7px;}
  html.embedded .panel{padding:7px;}
  html.embedded .panel h3{margin-bottom:4px;font-size:12px;}
  html.embedded .side{gap:7px;}
  html.embedded #radar{height:88px;}
  html.embedded #joystick{width:98px;height:98px;}
  html.embedded #btstat{margin:0 0 2px;font-size:10px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;}
  .panel h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--txt2);display:flex;justify-content:space-between;align-items:center;}
  #map{width:100%;height:300px;background:#0a0d12;border-radius:8px;overflow:hidden;}
  /* 大摄像头(第一视角)：铺满面板宽度，4:3 全帧无裁切 */
  #cam{width:100%;height:auto;display:block;background:#000;border-radius:8px;}
  .cam-off{width:100%;aspect-ratio:4/3;background:#0a0d12;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:14px;}
  #radar{width:100%;height:170px;background:#0a0d12;border-radius:8px;display:block;}
  .side{display:flex;flex-direction:column;gap:12px;}
  .joy-wrap{display:flex;flex-direction:column;align-items:center;}
  #btstat{width:100%;font-size:12px;color:var(--txt2);margin:2px 0 4px;}
  #btstat b{font-weight:600;}
  #joystick{width:170px;height:170px;background:#0a0d12;border:1px solid var(--line);border-radius:50%;position:relative;margin-top:2px;}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:560px){.metrics{grid-template-columns:repeat(2,1fr);}}
  .metric{background:var(--panel2);border-radius:var(--radius);padding:10px 12px;}
  .metric .l{font-size:12px;color:var(--txt2);}
  .metric .v{font-size:20px;font-weight:600;margin-top:2px;}
  .metric .v small{font-size:12px;color:var(--txt2);font-weight:400;}
  .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  button{font-family:inherit;font-size:14px;color:var(--txt);background:var(--panel2);
    border:1px solid var(--line);border-radius:var(--radius);padding:10px 16px;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:.15s;}
  button:hover{background:#2a313c;}
  button:active{transform:scale(.97);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.danger{background:var(--danger);border-color:var(--danger);color:#fff;margin-left:auto;}
  .params .row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .params .row:last-child{margin-bottom:0;}
  .params .row span:first-child{width:110px;font-size:13px;color:var(--txt2);}
  .params input[type=range]{flex:1;accent-color:var(--accent);}
  .params .out{width:70px;text-align:right;font-weight:600;font-size:13px;}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a313c;
    color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:99;font-size:13px;}
  #toast.show{opacity:1;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;background:var(--txt2);}
  /* 摄像头全屏（沉浸式 FPV）：只留摄像头，铺满整屏，自适应保持比例、不裁切（普通流，兼容 WebView） */
  html,body{height:100%;}
  html:has(body.camfull){overflow:hidden;background:#000;}
  body.camfull{position:fixed;inset:0;width:100vw;height:100vh;background:#000;overflow:hidden;}
  /* WebView 在部分 Retroid ROM 上会盖住 Compose 绘制层；网页同步画按钮，点击仍由原生按钮接收。 */
  body.camfull::before{content:'⛶  退出全屏';position:fixed;right:14px;top:12px;z-index:9999;
    color:#22d3ee;background:#121a26;border:1px solid #223247;border-radius:8px;
    padding:8px 12px;font-size:12px;pointer-events:none;}
  body.camfull .wrap{max-width:none;padding:0;margin:0;height:100vh;gap:0;}
  body.camfull .wrap>*{display:none!important;}
  body.camfull .wrap>.grid{display:block!important;height:100vh;}
  body.camfull .grid>.side{display:none!important;}
  body.camfull .grid>.panel{background:#000;border:none;padding:0;margin:0;height:100vh;
    display:flex;align-items:center;justify-content:center;}
  body.camfull .grid>.panel h3{display:none;}
  body.camfull #cam{width:100vw;height:100vh;object-fit:contain;background:#000;border-radius:0;}
  body.camfull .cam-off{width:100vw;height:100vh;background:#000;border-radius:0;}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="bar-left">
      <span class="title">阿克曼小车控制台</span>
      <span id="conn" class="chip off"><span class="dot"></span>未连接</span>
      <span id="mode" class="chip mode">模式：待机</span>
    </div>
    <span id="batt" class="chip">电量 --</span>
  </div>

  <div class="grid">
    <div class="panel">
      <h3><span>摄像头图传 · 第一视角</span><span id="caminfo" style="color:var(--txt2)"></span></h3>
      <img id="cam" alt="camera" style="display:none">
      <div id="camoff" class="cam-off">摄像头未开启 / 未连接</div>
    </div>
    <div class="side">
      <div class="panel">
        <h3>激光雷达实时</h3>
        <canvas id="radar" width="276" height="170"></canvas>
      </div>
      <div class="panel joy-wrap">
        <h3 style="align-self:flex-start;width:100%">虚拟摇杆 · 蓝牙直连驱动（松手停）</h3>
        <div id="btstat">蓝牙：<b id="btstat_v" style="color:var(--txt2)">检测中…</b></div>
        <div id="joystick"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h3><span>地图 / 导航（建图或导航时显示；地图上拖拽设目标点）</span><span id="mapinfo" style="color:var(--txt2)"></span></h3>
    <div id="map"></div>
  </div>

  <div class="metrics">
    <div class="metric"><div class="l">线速度</div><div class="v"><span id="m_lin">0.00</span><small> m/s</small></div></div>
    <div class="metric"><div class="l">角速度</div><div class="v"><span id="m_ang">0.00</span><small> rad/s</small></div></div>
    <div class="metric"><div class="l">位置 X / Y</div><div class="v"><span id="m_xy">0.0 / 0.0</span><small> m</small></div></div>
    <div class="metric"><div class="l">朝向 Yaw</div><div class="v"><span id="m_yaw">0</span><small> °</small></div></div>
  </div>

  <div class="actions">
    <button class="primary" onclick="api('mapping/start','开始建图')">一键建图</button>
    <button onclick="api('map/save','保存地图')">保存地图</button>
    <button class="primary" onclick="api('navigation/start','开始导航')">一键导航</button>
    <button onclick="api('stop_all','停止所有功能')">停止功能</button>
    <button class="danger" onclick="estop()">急停</button>
  </div>

  <div class="panel params">
    <h3>运动参数设置（滑条立即影响遥控速度上限）</h3>
    <div class="row"><span>最大线速度</span><input id="p_lin" type="range" min="0" max="1.5" step="0.05" value="0.5"><span class="out"><span id="p_lin_v">0.50</span> m/s</span></div>
    <div class="row"><span>最大角速度</span><input id="p_ang" type="range" min="0" max="2" step="0.05" value="0.8"><span class="out"><span id="p_ang_v">0.80</span> rad/s</span></div>
    <div class="row"><span>最小转弯半径</span><input id="p_turn" type="range" min="0.2" max="1.2" step="0.05" value="0.5"><span class="out"><span id="p_turn_v">0.50</span> m</span></div>
    <div class="actions" style="margin-top:4px"><button onclick="applyParams()">↧ 应用到底盘（需后台）</button></div>
  </div>

</div>
<div id="toast"></div>

<!-- 本地依赖库（离线，由 setup_download_libs.sh 下载到 lib/） -->
<script src="lib/eventemitter2.min.js"></script>
<script src="lib/roslib.min.js"></script>
<script src="lib/easeljs.min.js"></script>
<script src="lib/ros2d.min.js"></script>
<script src="lib/nav2d.min.js"></script>
<script src="lib/nipplejs.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
